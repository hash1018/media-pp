[package]
name = "media-pp"
version = "0.1.0"
edition = "2024"

[dependencies]
ffmpeg-next = "8"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
thiserror = "2"
renderer-engine = { git = "https://github.com/hash1018/RendererEngine", package = "renderer-engine", optional = true }
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
] }
ort = { version = "2.0.0-rc.13", optional = true }
ndarray = { version = "0.17", optional = true }

[features]
dx12-renderer = ["dep:renderer-engine", "dep:windows"]
rtsp-server = []
ort = ["dep:ort", "dep:ndarray"]
