[package]
name = "media-pp"
version = "0.1.2"
edition = "2024"
# Verified with `cargo +1.88 check` across every feature. Edition 2024 alone
# needs only 1.85; 1.88 is the highest MSRV among the resolved dependencies.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hash1018/media-pp"
readme = "../README.md"
description = "A small, GStreamer-flavored media pipeline library built on FFmpeg."
keywords = ["ffmpeg", "video", "audio", "pipeline", "streaming"]
categories = ["multimedia::video", "multimedia::audio", "multimedia::encoding"]

# Generate the public Windows API on its real target. docs.rs runs on Linux,
# but rustdoc does not link a final binary, so its host FFmpeg installation is
# sufficient for ffmpeg-sys-next to generate/type-check bindings. The Cargo
# config override is scoped to this docs.rs invocation only.
[package.metadata.docs.rs]
features = [
    "d3d11-renderer",
    "d3d12-renderer",
    "dxgi-capture",
    "wasapi-capture",
    "wasapi-renderer",
    "webrtc",
]
default-target = "x86_64-pc-windows-msvc"
targets = []
cargo-args = ['--config=env.PKG_CONFIG_ALLOW_CROSS="1"']

[dependencies]
ffmpeg-next = "8"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
arc-swap = "1"
thiserror = "2"
time = { version = "0.3", features = ["local-offset"] }
tracing-appender = "0.2"
ort = { version = "2.0.0-rc.13", optional = true }
ndarray = { version = "0.17", optional = true }
str0m = { version = "0.21", optional = true, default-features = false, features = [
    "wincrypto",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # `IDXGIOutput::GetDesc`'s `DXGI_OUTPUT_DESC` return type has a
    # `Monitor: HMONITOR` field — windows-rs silently drops `GetDesc`
    # from its generated bindings without this feature to supply that
    # type, rather than erroring at generation time.
    "Win32_Graphics_Gdi",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
ab_glyph = { version = "0.2", optional = true }

[features]
d3d12-renderer = ["dep:windows"]
d3d11-renderer = ["dep:windows", "dep:ab_glyph"]
dxgi-capture = ["dep:windows", "d3d11-renderer"]
wasapi-capture = ["dep:windows"]
wasapi-renderer = ["dep:windows"]
ort = ["dep:ort", "dep:ndarray"]
webrtc = ["dep:str0m"]

[dev-dependencies]
log = "0.4"
