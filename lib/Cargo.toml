[package]
name = "media-pp"
version = "0.2.0"
edition = "2024"
# Verified with `cargo +1.88 check` across every feature. Edition 2024 alone
# needs only 1.85; 1.88 is the highest MSRV among the resolved dependencies.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hash1018/media-pp"
documentation = "https://docs.rs/media-pp"
readme = "../README.md"
description = "A small, GStreamer-flavored media pipeline library built on FFmpeg. Capture, composite and encode without leaving the GPU, on D3D11 and CUDA."
keywords = ["ffmpeg", "gstreamer", "video", "audio", "screen-capture"]
categories = ["multimedia::video", "multimedia::audio", "multimedia::encoding"]

# Build docs.rs on its native Linux target. `ffmpeg-sys-next` generates FFI
# bindings from the installed target headers, so using Linux headers while
# cross-documenting a Windows target produces invalid ABI layout assertions.
# Full Windows API docs are built separately on a Windows GitHub Actions runner.
#
# These are the optional features that build on Linux without network access:
# `ort-sys`'s build script returns early when docs.rs sets `DOCS_RS`,
# `str0m`'s `rust-crypto` backend and `nnnoiseless` are pure Rust, and `whisper-rs-sys` ships
# whisper.cpp's sources inside its own package and compiles them with cmake,
# which docs.rs has — its own crate documents there.
#
# `whisper` rather than `whisper-vulkan`: the Vulkan backend needs the SDK's
# shader compiler at build time, which docs.rs has no reason to carry, and
# the two present the same API either way.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
features = ["ort", "rnnoise", "webrtc", "whisper"]
rustdoc-args = ["--cfg", "docsrs", "-D", "warnings"]

[dependencies]
ffmpeg-next = "8"
# Never referenced from code — the FFI comes through `ffmpeg::ffi`. Cargo hands the
# FFmpeg version that `ffmpeg-sys-next` detected only to the build script of a crate
# that depends on it directly, and `build.rs` needs it to reject FFmpeg older than 8.0.
ffmpeg-sys-next = { version = "8.1", default-features = false }
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
arc-swap = "1"
thiserror = "2"
time = { version = "0.3", features = ["local-offset"] }
tracing-appender = "0.2"
ort = { version = "2.0.0-rc.13", optional = true }
ndarray = { version = "0.17", optional = true }
whisper-rs = { version = "0.16", optional = true }
str0m = { version = "0.21", optional = true, default-features = false, features = [
    "rust-crypto",
] }
# Glyph rasterization for compositor text layers — needed by every backend
# that draws one, so not Windows-only.
ab_glyph = { version = "0.2", optional = true }
# RNNoise, as pure Rust with its weights compiled in — see `NoiseSuppressor`.
# Without its default features, which are the command-line tool's.
nnnoiseless = { version = "0.5", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# `async-io` rather than the default `tokio` backend: `PipeWireScreenCaptureSource::open`
# drives the portal handshake to completion with `pollster::block_on` on the
# caller's own thread, so it must not require callers of this synchronous
# library to already have a tokio runtime installed.
ashpd = { version = "0.13", optional = true, default-features = false, features = [
    "screencast",
    "async-io",
] }
# Already in the tree via `ashpd`'s `async-io` backend; taken directly so the
# portal session's `Closed` signal can be waited on with a bounded poll.
async-io = { version = "2", optional = true }
enumflags2 = { version = "0.7", optional = true }
futures-util = { version = "0.3", optional = true }
# `v0_3_50` is where both `pw_buffer.requested` and `pw_time.buffered` appear:
# the first tells a playback stream how many frames the graph wants this cycle
# (filling the whole buffer instead drains the queue in bursts and stutters),
# the second is the converter latency the reported position has to subtract.
# `requested` is documented "Since 0.3.50", so the older `v0_3_49` pin named a
# version that did not have it. Raises the minimum libpipewire to 0.3.50
# (2022); distributions ship far newer.
# The four read-only V4L2 ioctls a camera picker needs — see
# `platform::linux::v4l2`. Capture itself goes through FFmpeg's own
# `video4linux2` demuxer, which is why this is the whole of the dependency.
libc = { version = "0.2", optional = true }
pipewire = { version = "0.10.1", optional = true, features = ["v0_3_50"] }
pollster = { version = "1", optional = true }

# Every `unsafe` block in this crate states why it is sound. The rule is
# worth enforcing rather than remembering: writing these honestly is what
# surfaced the DMA-BUF import's create-then-destroy ordering and the GL name
# wrappers whose `count` no type constrained.
[lints.clippy]
undocumented_unsafe_blocks = "deny"

[features]
# CUDA-resident decode and rendering. Needs no extra Rust dependency: FFmpeg
# owns the CUDA context and the frame pool, and this crate's CUDA elements
# only ever move `AVFrame`s around. The graphics-API interop that actually
# displays a CUDA frame lives in the caller's own `CudaFrameRenderer`
# implementation, which is where `ash`/`windows-rs` would be pulled in.
# Not platform-gated: CUDA is available on Linux and Windows alike.
cuda = ["dep:ab_glyph"]
d3d12 = [
    "dep:windows",
    "windows/Win32_Foundation",
    "windows/Win32_Graphics_Direct3D12",
    "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_Media_MediaFoundation",
    # `CreateEventW` is hidden by windows-rs without its SECURITY_ATTRIBUTES type.
    "windows/Win32_Security",
    "windows/Win32_System_Threading",
]
d3d11 = [
    "dep:windows",
    "dep:ab_glyph",
    "windows/Win32_Foundation",
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D_Fxc",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_Dxgi_Common",
]
dxgi-capture = [
    "d3d11",
    "windows/Win32_Graphics_Dxgi",
    # `IDXGIOutput::GetDesc`'s `DXGI_OUTPUT_DESC` return type contains an
    # `HMONITOR`, so windows-rs omits `GetDesc` without the GDI feature.
    "windows/Win32_Graphics_Gdi",
]
wgc-capture = [
    "d3d11",
    "windows/Graphics_Capture",
    "windows/Graphics_DirectX_Direct3D11",
    "windows/Win32_Graphics_Dxgi",
    # One never-released MTA reference keeps the WinRT component DLLs that
    # windows-rs caches activation factories from loaded; see
    # `retain_process_mta`.
    "windows/Win32_System_Com",
    # Teardown has to tell a destroyed window apart from a dead owning
    # process; see `WgcRuntime::drop`.
    "windows/Win32_System_Threading",
    "windows/Win32_System_WinRT_Direct3D11",
    "windows/Win32_System_WinRT_Graphics_Capture",
    "windows/Win32_UI_Accessibility",
    "windows/Win32_UI_WindowsAndMessaging",
]
mf-capture = [
    "dep:windows",
    "windows/Win32_Foundation",
    "windows/Win32_Media_MediaFoundation",
    "windows/Win32_System_Com",
    "windows/Win32_System_Com_StructuredStorage",
]
v4l2-capture = ["dep:libc"]
pipewire-audio-capture = ["dep:pipewire"]
pipewire-audio-renderer = ["dep:pipewire"]
pipewire-screen-capture = [
    "dep:ashpd",
    "dep:async-io",
    "dep:enumflags2",
    "dep:futures-util",
    "dep:pipewire",
    "dep:pollster",
]
wasapi-capture = [
    "dep:windows",
    "windows/Win32_Foundation",
    "windows/Win32_Devices_FunctionDiscovery",
    "windows/Win32_Media_Audio",
    "windows/Win32_Media_KernelStreaming",
    "windows/Win32_Media_Multimedia",
    "windows/Win32_System_Com",
    "windows/Win32_System_Com_StructuredStorage",
    "windows/Win32_System_Variant",
    "windows/Win32_UI_Shell_PropertiesSystem",
]
wasapi-renderer = [
    "dep:windows",
    "windows/Win32_Foundation",
    "windows/Win32_Devices_FunctionDiscovery",
    "windows/Win32_Media_Audio",
    "windows/Win32_Media_KernelStreaming",
    "windows/Win32_Media_Multimedia",
    "windows/Win32_System_Com",
    "windows/Win32_System_Com_StructuredStorage",
    "windows/Win32_System_Variant",
    "windows/Win32_UI_Shell_PropertiesSystem",
]
ort = ["dep:ort", "dep:ndarray"]
# Noise suppression for speech, through RNNoise. Pure Rust and no model file:
# the network's weights are part of the crate.
rnnoise = ["dep:nnnoiseless"]
# Speech to text, through whisper.cpp. Its build is C++ and needs cmake,
# which every CI runner already has; the model is a file the caller
# supplies, since nothing that size belongs in a crate.
whisper = ["dep:whisper-rs"]
# The same, on the GPU. Vulkan rather than CUDA deliberately: the CUDA
# backend needs the toolkit to build and only serves NVIDIA, while this
# needs the Vulkan SDK's shader compiler at build time — the runtime ships
# with every driver — and serves AMD and Intel too. Measured at ~13x real
# time against ~0.4x on the CPU for the same model.
#
# Building this on Windows needs two things, and neither alone is enough.
# ggml builds its shader generator as a CMake ExternalProject, whose nested
# paths run past `MAX_PATH`:
#
#   1. Long paths on:
#      `HKLM\SYSTEM\CurrentControlSet\Control\FileSystem\LongPathsEnabled=1`
#      Without it MSBuild cannot create the directories at all.
#   2. A short `CARGO_TARGET_DIR`, e.g. `C:\t`. MSBuild honours long paths
#      once (1) is set, but `FileTracker` — the native tool it logs file
#      access with — does not, and fails with FTK1011 from a target
#      directory as ordinary as `D:\Project\media-pp\target`.
#
# Turning `FileTracker` off with `TrackFileAccess=false` clears FTK1011 and
# breaks the ExternalProject's step ordering instead, so it is not a way
# round (2). The CPU `whisper` feature needs none of this, and neither does
# Linux.
whisper-vulkan = ["whisper", "whisper-rs/vulkan"]
webrtc = ["dep:str0m"]

[dev-dependencies]
log = "0.4"

# `tests/soak.rs` measures process private bytes, adapter video memory, and
# the D3D11 debug layer's live-object count. Unlike the library's own
# optional `windows` dependency this one is not feature-gated: the private-
# bytes gauge every soak scenario uses is plain Win32, needed whether or not
# `d3d11` is enabled.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
