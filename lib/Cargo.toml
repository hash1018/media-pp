[package]
name = "media-pp"
version = "0.1.6"
edition = "2024"
# Verified with `cargo +1.88 check` across every feature. Edition 2024 alone
# needs only 1.85; 1.88 is the highest MSRV among the resolved dependencies.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hash1018/media-pp"
documentation = "https://docs.rs/media-pp"
readme = "../README.md"
description = "A small, GStreamer-flavored media pipeline library built on FFmpeg."
keywords = ["ffmpeg", "video", "audio", "pipeline", "streaming"]
categories = ["multimedia::video", "multimedia::audio", "multimedia::encoding"]

# Build docs.rs on its native Linux target. `ffmpeg-sys-next` generates FFI
# bindings from the installed target headers, so using Linux headers while
# cross-documenting a Windows target produces invalid ABI layout assertions.
# Full Windows API docs are built separately on a Windows GitHub Actions runner.
#
# `ort` and `webrtc` are the only optional features that build on Linux without
# network access: `ort-sys`'s build script returns early when docs.rs sets
# `DOCS_RS`, and `str0m`'s `rust-crypto` backend is pure Rust.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
features = ["ort", "webrtc"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
ffmpeg-next = "8"
# Never referenced from code — the FFI comes through `ffmpeg::ffi`. Cargo hands the
# FFmpeg version that `ffmpeg-sys-next` detected only to the build script of a crate
# that depends on it directly, and `build.rs` needs it to reject FFmpeg older than 8.0.
ffmpeg-sys-next = { version = "8.1", default-features = false }
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
arc-swap = "1"
thiserror = "2"
time = { version = "0.3", features = ["local-offset"] }
tracing-appender = "0.2"
ort = { version = "2.0.0-rc.13", optional = true }
ndarray = { version = "0.17", optional = true }
str0m = { version = "0.21", optional = true, default-features = false, features = [
    "rust-crypto",
] }
# Glyph rasterization for compositor text layers — needed by every backend
# that draws one, so not Windows-only.
ab_glyph = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # `IDXGIOutput::GetDesc`'s `DXGI_OUTPUT_DESC` return type has a
    # `Monitor: HMONITOR` field — windows-rs silently drops `GetDesc`
    # from its generated bindings without this feature to supply that
    # type, rather than erroring at generation time.
    "Win32_Graphics_Gdi",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# `async-io` rather than the default `tokio` backend: `PipeWireScreenCaptureSource::open`
# drives the portal handshake to completion with `pollster::block_on` on the
# caller's own thread, so it must not require callers of this synchronous
# library to already have a tokio runtime installed.
ashpd = { version = "0.13", optional = true, default-features = false, features = [
    "screencast",
    "async-io",
] }
# Already in the tree via `ashpd`'s `async-io` backend; taken directly so the
# portal session's `Closed` signal can be waited on with a bounded poll.
async-io = { version = "2", optional = true }
enumflags2 = { version = "0.7", optional = true }
futures-util = { version = "0.3", optional = true }
# `v0_3_49` is needed for `pw_buffer.requested`, which tells a playback stream
# how many frames the graph wants this cycle. Without it a renderer can only
# fill the whole buffer, which drains its queue in bursts and stutters. Raises
# the minimum libpipewire to 0.3.49 (2022); distributions ship far newer.
pipewire = { version = "0.10", optional = true, features = ["v0_3_49"] }
pollster = { version = "1", optional = true }

[features]
# CUDA-resident decode and rendering. Needs no extra Rust dependency: FFmpeg
# owns the CUDA context and the frame pool, and this crate's CUDA elements
# only ever move `AVFrame`s around. The graphics-API interop that actually
# displays a CUDA frame lives in the caller's own `CudaFrameRenderer`
# implementation, which is where `ash`/`windows-rs` would be pulled in.
# Not platform-gated: CUDA is available on Linux and Windows alike.
cuda = ["dep:ab_glyph"]
d3d12 = ["dep:windows"]
d3d11 = ["dep:windows", "dep:ab_glyph"]
dxgi-capture = ["dep:windows", "d3d11"]
pipewire-audio-capture = ["dep:pipewire"]
pipewire-audio-renderer = ["dep:pipewire"]
pipewire-screen-capture = [
    "dep:ashpd",
    "dep:async-io",
    "dep:enumflags2",
    "dep:futures-util",
    "dep:pipewire",
    "dep:pollster",
]
wasapi-capture = ["dep:windows"]
wasapi-renderer = ["dep:windows"]
ort = ["dep:ort", "dep:ndarray"]
webrtc = ["dep:str0m"]

[dev-dependencies]
log = "0.4"
