[package]
name = "media-pp-vcam"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The camera side of media-pp's Windows virtual camera: a Media Foundation media source that Frame Server loads"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hash1018/media-pp"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Variant",
] }
# `windows::core::implement` expands to absolute `::windows_core` paths.
windows-core = "0.62"
