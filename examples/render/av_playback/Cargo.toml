[package]
name = "av_playback"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
render_common = { path = "../render_common" }
winit = "0.30"

[target.'cfg(windows)'.dependencies]
media-pp = { path = "../../../lib", features = ["d3d12", "wasapi-renderer"] }

[target.'cfg(target_os = "linux")'.dependencies]
media-pp = { path = "../../../lib", features = [
    "cuda",
    "pipewire-audio-renderer",
] }
