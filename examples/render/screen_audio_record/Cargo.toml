[package]
name = "screen_audio_record"
version = "0.1.0"
edition = "2024"
publish = false

[target.'cfg(windows)'.dependencies]
media-pp = { path = "../../../lib", features = ["dxgi-capture", "wasapi-capture"] }

[target.'cfg(target_os = "linux")'.dependencies]
media-pp = { path = "../../../lib", features = [
    "pipewire-screen-capture",
    "pipewire-audio-capture",
] }
