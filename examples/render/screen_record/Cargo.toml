[package]
name = "screen_record"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ffmpeg-next = "8"

[target.'cfg(windows)'.dependencies]
media-pp = { path = "../../../lib", features = ["dxgi-capture"] }

[target.'cfg(target_os = "linux")'.dependencies]
media-pp = { path = "../../../lib", features = ["pipewire-screen-capture"] }
