[package]
name = "sw_decode_render"
version = "0.1.0"
edition = "2024"
publish = false

# `VideoWindow` needs a platform window renderer: D3D11 on Windows, Vulkan on
# Linux.
[target.'cfg(windows)'.dependencies]
media-pp = { path = "../../../lib", features = ["d3d11"] }
render_common = { path = "../render_common" }

[target.'cfg(target_os = "linux")'.dependencies]
media-pp = { path = "../../../lib", features = ["vulkan"] }
render_common = { path = "../render_common" }
