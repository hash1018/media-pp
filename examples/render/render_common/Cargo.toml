[package]
name = "render_common"
version = "0.1.0"
edition = "2024"
publish = false

# The windows and the renderers are the library's own; this crate only turns
# closing one into a stop — and on Linux fits a software decode to
# `VulkanWindowRenderer`.
[target.'cfg(target_os = "linux")'.dependencies]
media-pp = { path = "../../../lib", features = ["vulkan"] }

[target.'cfg(windows)'.dependencies]
media-pp = { path = "../../../lib", features = ["d3d11"] }
