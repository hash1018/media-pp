[package]
name = "nvenc_record"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ffmpeg-next = "8"

[target.'cfg(windows)'.dependencies]
media-pp = { path = "../../../lib", features = ["d3d11"] }
render_common = { path = "../render_common" }

[target.'cfg(target_os = "linux")'.dependencies]
media-pp = { path = "../../../lib", features = ["cuda"] }
