[package]
name = "cut_detect"
version = "0.1.0"
edition = "2024"
publish = false

# The same program everywhere; on Linux and Windows `--cuda` decodes on an
# NVIDIA GPU and finds the cuts there.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
media-pp = { path = "../../../lib", features = ["cuda"] }

[target.'cfg(not(any(target_os = "linux", target_os = "windows")))'.dependencies]
media-pp = { path = "../../../lib" }
