name: API documentation

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

# docs.rs builds on Linux only, so the Windows and the macOS API are
# documented here, each on a runner of its own platform. The Linux API is
# too: docs.rs has no PipeWire development files and no FFmpeg built with
# Vulkan, so it documents only the features that need neither (see
# `[package.metadata.docs.rs]`), and the Linux backends would be on no page
# at all. All three are published together as one GitHub Pages site:
# `windows/`, `macos/` and `linux/`, with a page at the root choosing
# between them.
#
# Built on every change and published only from a tag or by hand, so a
# documentation error shows on the push that made it rather than first when a
# version is tagged.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push cancels the documentation build under way: only the newest
# commit's says anything, and nothing is published from a push. A tag and a
# run by hand are groups of their own, so a push to main never cancels a
# publish; the deploy job also queues on `pages` rather than cancelling.
concurrency:
  group: api-docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Nightly only for rustdoc: `doc_cfg` is what labels each item with the
      # Cargo feature that enables it, and it is still unstable. The library
      # itself builds on stable (see `rust-version` in `lib/Cargo.toml`).
      # One command per step, for the reason the CI workflow gives at length:
      # GitHub's pwsh wrapper exits with the *last* command's `$LASTEXITCODE`,
      # so anything that fails before it is swallowed.
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install nightly --profile minimal

      - name: Select Rust toolchain
        shell: pwsh
        run: rustup default nightly

      # Shared with the CI workflow, which is also what keeps the FFmpeg cache
      # this restores alive: cache entries are readable from the default branch
      # and evicted after seven days without a hit, so a tag-triggered build
      # relies on the pushes and pull requests that ran in between.
      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      # Every feature that builds on Windows, so this build stays a strict
      # superset of docs.rs, which can only reach the non-Windows ones —
      # CUDA and the GPU inference providers among them, which documenting
      # never links. `whisper-vulkan` is left out: it needs the Vulkan SDK's
      # shader compiler to build, and presents the API `whisper` does.
      #
      # `DOCS_RS` is what the `ort` feature needs here. `ort-sys`'s build script
      # otherwise downloads ONNX Runtime and links its dylibs into the target
      # directory, which panicked on the runner because symlinks need Developer
      # Mode and its copy fallback could not resolve the destination. Documenting
      # never links, and `ort-sys` returns early when this is set. It is safe for
      # the rest of the graph: `ffmpeg-sys-next` does not read `DOCS_RS`, so the
      # bindings above are still generated from the pinned headers.
      - name: Build Windows API documentation
        shell: pwsh
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
          DOCS_RS: "1"
        run: cargo doc -p media-pp --no-deps --features d3d11,d3d12,dxgi-capture,wgc-capture,mf-capture,mf-virtual-camera,wasapi-capture,wasapi-renderer,vulkan,cuda,cuda-visual-tracking,webrtc,rtsp-server,ort,ort-cuda,ort-tensorrt,ort-directml,whisper,rnnoise

      # A feature dropped from the list above still documents cleanly — it
      # only takes its types with it — so what each GPU feature makes is
      # looked for.
      - name: Check the GPU APIs are documented
        shell: pwsh
        run: |
          foreach ($page in @(
            'elements/filter/struct.CudaDecoder.html',
            'elements/vision/struct.CudaOrtDetector.html',
            'elements/vision/struct.D3d12OrtDetector.html',
            'elements/filter/struct.D3d12VideoEncoder.html'
          )) {
            if (-not (Test-Path "target/doc/media_pp/$page")) { throw "not documented: $page" }
          }

      # Pages will not serve the `.lock` cargo leaves behind.
      - name: Drop the build lock
        shell: pwsh
        run: Remove-Item target/doc/.lock -ErrorAction SilentlyContinue

      - name: Upload Windows API documentation
        uses: actions/upload-artifact@v4
        with:
          name: windows-docs
          path: target/doc

  macos:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Nightly for `doc_cfg`, as on Windows.
      - name: Install Rust toolchain
        run: rustup toolchain install nightly --profile minimal

      - name: Select Rust toolchain
        run: rustup default nightly

      # No other workflow runs on macOS yet, so this one's own pushes to the
      # default branch are what keep this cache entry alive. `vulkan` is left
      # out of the port's features: the crate's `vulkan` feature is not
      # documented for macOS, and FFmpeg's Vulkan context needs MoltenVK
      # there.
      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg
        with:
          vcpkg-features: openh264

      # Every feature that builds on macOS. `DOCS_RS` for `ort`, as on
      # Windows: documenting never links, and `ort-sys` then downloads
      # nothing.
      - name: Build macOS API documentation
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
          DOCS_RS: "1"
        run: cargo doc -p media-pp --no-deps --features videotoolbox,metal,avfoundation-capture,screencapturekit-capture,coreaudio-capture,coreaudio-renderer,webrtc,rtsp-server,ort,ort-coreml,whisper,rnnoise

      # As on Windows: a feature dropped from the list takes its types with it.
      - name: Check the GPU APIs are documented
        run: |
          for page in elements/vision/struct.MetalOrtDetector.html elements/filter/struct.VideoToolboxDecoder.html; do
            test -f "target/doc/media_pp/$page" || { echo "not documented: $page"; exit 1; }
          done

      - name: Drop the build lock
        run: rm -f target/doc/.lock

      - name: Upload macOS API documentation
        uses: actions/upload-artifact@v4
        with:
          name: macos-docs
          path: target/doc

  linux:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Nightly for `doc_cfg`, as on Windows.
      - name: Install Rust toolchain
        run: rustup toolchain install nightly --profile minimal

      - name: Select Rust toolchain
        run: rustup default nightly

      # What the pipewire-* features build against, as in the CI workflow.
      - name: Install PipeWire development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev

      # The default features, `openh264,vulkan`: FFmpeg's Vulkan context and
      # the Vulkan headers the `vulkan` feature's bindings are made from.
      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      # Every feature that builds on Linux. `DOCS_RS` for `ort`, as on
      # Windows; CUDA, cuDNN, cuFFT and TensorRT are never linked by
      # documenting.
      - name: Build Linux API documentation
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
          DOCS_RS: "1"
        run: cargo doc -p media-pp --no-deps --features pipewire-screen-capture,pipewire-audio-capture,pipewire-audio-renderer,v4l2-capture,v4l2-virtual-camera,vulkan,cuda,cuda-visual-tracking,webrtc,rtsp-server,ort,ort-cuda,ort-tensorrt,whisper,rnnoise

      # As on Windows: a feature dropped from the list takes its types with it.
      - name: Check the Linux APIs are documented
        run: |
          for page in elements/source/struct.PipeWireScreenCaptureSource.html elements/source/struct.V4l2CaptureSource.html elements/sink/struct.VulkanWindowRenderer.html elements/filter/struct.VulkanDecoder.html elements/vision/struct.CudaOrtDetector.html; do
            test -f "target/doc/media_pp/$page" || { echo "not documented: $page"; exit 1; }
          done

      - name: Drop the build lock
        run: rm -f target/doc/.lock

      - name: Upload Linux API documentation
        uses: actions/upload-artifact@v4
        with:
          name: linux-docs
          path: target/doc

  # The three builds, as the one site Pages serves. `media_pp/` at the root is
  # where the Windows documentation used to be alone, and sends a link to
  # it on to `windows/`.
  pages:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [windows, macos, linux]
    steps:
      - name: Download Windows API documentation
        uses: actions/download-artifact@v4
        with:
          name: windows-docs
          path: site/windows

      - name: Download macOS API documentation
        uses: actions/download-artifact@v4
        with:
          name: macos-docs
          path: site/macos

      - name: Download Linux API documentation
        uses: actions/download-artifact@v4
        with:
          name: linux-docs
          path: site/linux

      - name: Write the landing pages
        run: |
          mkdir -p site/media_pp
          cat > site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>media-pp API documentation</title>
          <h1>media-pp API documentation</h1>
          <ul>
            <li><a href="windows/media_pp/">Windows</a></li>
            <li><a href="macos/media_pp/">macOS</a></li>
            <li><a href="linux/media_pp/">Linux</a></li>
          </ul>
          EOF
          echo '<meta http-equiv="refresh" content="0; url=../windows/media_pp/">' > site/media_pp/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: pages
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
