name: Windows API documentation

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Nightly only for rustdoc: `doc_cfg` is what labels each item with the
      # Cargo feature that enables it, and it is still unstable. The library
      # itself builds on stable (see `rust-version` in `lib/Cargo.toml`).
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      # Shared with the CI workflow, which is also what keeps the FFmpeg cache
      # this restores alive: cache entries are readable from the default branch
      # and evicted after seven days without a hit, so a tag-triggered build
      # relies on the pushes and pull requests that ran in between.
      - name: Set up FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      # Every feature, so this build stays a strict superset of docs.rs, which
      # can only reach the non-Windows ones.
      #
      # `DOCS_RS` is what the `ort` feature needs here. `ort-sys`'s build script
      # otherwise downloads ONNX Runtime and links its dylibs into the target
      # directory, which panicked on the runner because symlinks need Developer
      # Mode and its copy fallback could not resolve the destination. Documenting
      # never links, and `ort-sys` returns early when this is set. It is safe for
      # the rest of the graph: `ffmpeg-sys-next` does not read `DOCS_RS`, so the
      # bindings above are still generated from the pinned headers.
      - name: Build Windows API documentation
        shell: pwsh
        env:
          RUSTDOCFLAGS: --cfg docsrs
          DOCS_RS: "1"
        run: |
          cargo doc -p media-pp --no-deps --features d3d11,d3d12,dxgi-capture,wasapi-capture,wasapi-renderer,webrtc,ort
          '<meta http-equiv="refresh" content="0; url=media_pp/">' | Set-Content -Encoding utf8 target/doc/index.html
          Remove-Item target/doc/.lock -ErrorAction SilentlyContinue

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/doc

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
